name: sova-local

# Локальная инфраструктура разработки: PostgreSQL приложения, Redis, Gotenberg,
# Keycloak и отдельный PostgreSQL для Keycloak. Frontend и backend запускаются
# нативно из своих репозиториев и подключаются к этим сервисам через 127.0.0.1.
#
# Порты публикуются только на loopback. Если порт занят другим проектом,
# переопределите *_HOST_PORT в .env.local.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sova}
      POSTGRES_USER: ${POSTGRES_USER:-sova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOTENBERG_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  keycloak-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.local}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.local}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.local}
      SOVA_APP_URL: http://localhost:${FRONTEND_HOST_PORT:-3000}
      SOVA_OIDC_REDIRECT_URI: http://localhost:${FRONTEND_HOST_PORT:-3000}/api/auth/oidc/callback/
      SOVA_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-sova-web}
      SOVA_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env.local}
      SOVA_SMTP_HOST: ${EMAIL_HOST:-}
      SOVA_SMTP_PORT: ${EMAIL_PORT:-465}
      SOVA_SMTP_USER: ${EMAIL_HOST_USER:-}
      SOVA_SMTP_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      SOVA_SMTP_FROM: ${KEYCLOAK_EMAIL_FROM:-noreply@localhost}
      SOVA_SMTP_SSL: ${EMAIL_USE_SSL:-true}
      SOVA_SMTP_STARTTLS: ${EMAIL_USE_TLS:-false}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ./keycloak/sova-realm.json:/opt/keycloak/data/import/sova-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'HEAD /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  keycloak_postgres_data:
