# Overlay: собственное S3-совместимое хранилище (Garage) для файлов приложения.
#
# Подключается только когда S3_PROVIDER=garage (см. deploy.sh); для внешнего S3-провайдера
# этот файл не используется — backend получает готовые S3_* переменные напрямую в .env.
# Подробности: sova-backend/docs/plans/2026-09-23-s3-storage.md.

services:
  s3:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"
    networks:
      - sova
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    depends_on:
      s3:
        condition: service_healthy

  reports-worker:
    depends_on:
      s3:
        condition: service_healthy

volumes:
  garage_meta:
  garage_data:
